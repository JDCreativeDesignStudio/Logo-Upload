<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo bestanden uploaden</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#362923;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:6px 2px 18px}.field{margin-bottom:20px}
.field-label{display:block;margin-bottom:9px;font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase}
input[type=text],input[type=email]{width:100%;height:54px;padding:0 16px;border:1px solid #d9d0cb;border-radius:0;background:#fff;color:#362923;font:inherit;outline:none}
input:focus{border-color:#826558}
.drop{width:100%;min-height:185px;padding:30px 22px;border:1px dashed #b9aaa2;background:#f8f5f2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.drag{background:#fff;border-color:#826558}.icon{width:33px;height:33px;margin-bottom:14px;fill:none;stroke:#362923;stroke-width:1.4}
.drop-title{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.drop-info{margin:0;color:#766861;font-size:13px;line-height:1.6}#files{display:none}
.list{list-style:none;margin:14px 0 0;padding:0}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ded6d1;font-size:13px}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.size{flex:none;color:#857770}
.message{display:none;margin-top:14px;padding:12px 14px;font-size:13px;line-height:1.5}.error{background:#f8eeee}.success{background:#f2f4ef}
button{width:100%;margin-top:24px;padding:18px 22px;border:1px solid #362923;border-radius:0;background:#362923;color:#fff;font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;transition:.2s}
button:hover{background:transparent;color:#362923}button:disabled{opacity:.55;cursor:not-allowed}
.note{margin:12px 0 0;text-align:center;color:#857770;font-size:12px;line-height:1.5}
@media(max-width:600px){.wrap{padding:4px 0 14px}.drop{min-height:165px;padding:26px 16px}input[type=text],input[type=email]{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
<form id="uploadForm" enctype="multipart/form-data">
  <div class="field">
    <label class="field-label" for="name">Naam</label>
    <input id="name" name="fi-sender-fullName" type="text" placeholder="Jouw naam" required>
  </div>
  <div class="field">
    <label class="field-label" for="email">E-mailadres</label>
    <input id="email" name="fi-sender-email" type="email" placeholder="jouw@email.nl" required>
  </div>
  <div class="field">
    <label class="field-label">Logo bestanden</label>
    <label class="drop" id="drop" for="files">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M5 14v5h14v-5"/></svg>
      <p class="drop-title">Bestanden selecteren</p>
      <p class="drop-info">Sleep je bestanden hierheen of klik om te selecteren.<br>AI, EPS, SVG, PDF, PNG of JPG · maximaal 5 MB per bestand</p>
    </label>
    <input id="files" type="file" name="fi-file-logo[]" accept=".ai,.eps,.svg,.pdf,.png,.jpg,.jpeg" multiple required>
    <ul class="list" id="list"></ul>
    <div class="message error" id="error"></div>
    <div class="message success" id="success">✓ Bedankt! Je bestanden zijn succesvol verstuurd.</div>
  </div>
  <button id="submit" type="submit">Bestanden versturen</button>
  <p class="note">Je bestanden worden veilig verstuurd naar JD Creative Design Studio.</p>
</form>
</div>

<script src="https://forminit.com/sdk/v1/forminit.js"></script>
<script>
(function(){
 const FORM_ID='x4xk8gq0uh7';
 const forminit=new Forminit();
 const input=document.getElementById('files'),form=document.getElementById('uploadForm'),
 list=document.getElementById('list'),error=document.getElementById('error'),
 success=document.getElementById('success'),drop=document.getElementById('drop'),
 submit=document.getElementById('submit');
 const MAX_FILE=5*1024*1024, MAX_TOTAL=25*1024*1024;
 const allowed=['ai','eps','svg','pdf','png','jpg','jpeg'];
 const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
 const size=b=>(b/1024/1024).toFixed(1)+' MB';
 function fail(m){success.style.display='none';error.textContent=m;error.style.display='block'}
 function clear(){error.textContent='';error.style.display='none';success.style.display='none'}
 function validate(files){
   clear();list.innerHTML='';if(!files.length){fail('Selecteer minimaal één bestand.');return false}
   let total=0;
   for(const f of files){
     const ext=(f.name.split('.').pop()||'').toLowerCase();
     if(!allowed.includes(ext)){fail(f.name+' wordt niet ondersteund. Kies AI, EPS, SVG, PDF, PNG of JPG.');return false}
     if(f.size>MAX_FILE){fail(f.name+' is groter dan 5 MB. Kies een kleiner bestand.');return false}
     total+=f.size;
   }
   if(total>MAX_TOTAL){fail('De bestanden zijn samen groter dan 25 MB. Upload minder bestanden.');return false}
   [...files].forEach(f=>{const li=document.createElement('li');li.className='item';li.innerHTML='<span class="name">✓ '+esc(f.name)+'</span><span class="size">'+size(f.size)+'</span>';list.appendChild(li)});
   return true;
 }
 input.addEventListener('change',()=>validate(input.files));
 ['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));
 ['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));
 drop.addEventListener('drop',e=>{const dt=new DataTransfer();[...e.dataTransfer.files].forEach(f=>dt.items.add(f));input.files=dt.files;validate(input.files)});
 form.addEventListener('submit',async e=>{
   e.preventDefault();
   if(!validate(input.files))return;
   submit.disabled=true;submit.textContent='Bestanden versturen...';
   const {error:submitError}=await forminit.submit(FORM_ID,new FormData(form));
   submit.disabled=false;submit.textContent='Bestanden versturen';
   if(submitError){fail('Versturen is niet gelukt. Probeer het opnieuw. '+(submitError.message||''));return}
   form.reset();list.innerHTML='';error.style.display='none';success.style.display='block';
 });
})();
</script>
</body>
</html>
